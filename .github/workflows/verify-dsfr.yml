name: DSFR verifier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify DSFR CLI without network
        run: python3 -m unittest discover -s skills/gouv-fr/dsfr/set-up-french-state-design-system/tests -v
